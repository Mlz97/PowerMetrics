spring.application.name=PwrMetrics
# H2 Database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Python Analysis Service
python.service.url=${PWR_ANALYSIS_URL:http://localhost:8000}

# Video storage: must be the same path the analysis service sees
pwr.storage.dir=${PWR_STORAGE_DIR:uploads}

# File Upload Limits (oversized uploads answer 413 FILE_TOO_LARGE)
spring.servlet.multipart.max-file-size=${PWR_UPLOAD_MAX_FILE_SIZE:200MB}
spring.servlet.multipart.max-request-size=${PWR_UPLOAD_MAX_REQUEST_SIZE:210MB}
server.tomcat.max-swallow-size=${PWR_UPLOAD_MAX_REQUEST_SIZE:210MB}

# CORS: comma-separated origins allowed to call the API from a browser
pwr.cors.allowed-origins=${PWR_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Per-IP rate limits (429 TOO_MANY_REQUESTS with Retry-After)
pwr.rate-limit.upload-per-hour=${PWR_RATE_UPLOAD_PER_HOUR:5}
pwr.rate-limit.upload-per-day=${PWR_RATE_UPLOAD_PER_DAY:20}
pwr.rate-limit.create-per-hour=${PWR_RATE_CREATE_PER_HOUR:30}
pwr.rate-limit.general-per-minute=${PWR_RATE_GENERAL_PER_MINUTE:120}

# Analysis capacity: concurrent analyses and queued ones before uploads answer 503 ANALYSIS_BUSY
pwr.analysis.concurrency=${PWR_ANALYSIS_CONCURRENCY:2}
pwr.analysis.queue-capacity=${PWR_ANALYSIS_QUEUE_CAPACITY:10}
